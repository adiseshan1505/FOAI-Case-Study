[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infodemic"
version = "0.1.0"
description = "Multi-agent adversarial simulation of misinformation spreaders vs. fact-checking moderators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["networkx", "numpy", "pandas", "matplotlib", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
